# SMA Survey Desktop: uji mesin Rust lalu buat installer Windows (.msi dan setup .exe).
# Hasil installer: tab Actions → run terakhir → Artifacts → "SMA-Survey-installer".
# Rilis: buat tag v0.4.0 dst → installer juga dilampirkan di halaman Releases (draft).
name: desktop

on:
  push:
    branches: [desktop-tauri, main]
    tags: ['v*']
    paths: ['desktop/**', 'viewer/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'viewer/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Uji mesin sma-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --release --manifest-path desktop/core/Cargo.toml

  windows:
    name: Installer Windows
    needs: core
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri -> target
      - name: Pasang Tauri CLI
        run: npm install
      - name: Build installer
        run: npx tauri build
      - name: Uji backend (pelindung folder server, paket data, SQLite)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib
      - name: Paket portable (tanpa instal)
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $d = "portable/SMA-Survey-$v-portable"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item src-tauri/target/release/sma-survey.exe "$d/SMA Survey.exe"
          @(
            'SMA Survey versi portable (tanpa instal).'
            ''
            'Cara pakai: salin folder ini ke mana saja (D:\, flashdisk), lalu klik dua kali "SMA Survey.exe".'
            'Riwayat volume, daftar folder Navigator, dan pengaturan disimpan di folder data\ di samping exe.'
            'Hapus file portable.txt ini kalau mau memakai folder data biasa (AppData) seperti versi terpasang.'
            ''
            'Butuh Microsoft Edge WebView2 Runtime (sudah ada di Windows 10/11 yang ter-update).'
            'Kalau aplikasi tidak terbuka: https://go.microsoft.com/fwlink/p/?LinkId=2124703'
            'Asosiasi file .str/.dtm dan shortcut Start Menu hanya ada di versi installer.'
          ) | Set-Content -Encoding utf8 "$d/portable.txt"
          Compress-Archive -Path $d -DestinationPath "portable/SMA-Survey-$v-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SMA-Survey-portable
          path: desktop/app/portable/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SMA-Survey-installer
          path: |
            desktop/app/src-tauri/target/release/bundle/msi/*.msi
            desktop/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Lampirkan ke Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/app/src-tauri/target/release/bundle/msi/*.msi
            desktop/app/src-tauri/target/release/bundle/nsis/*.exe
            desktop/app/portable/*.zip
