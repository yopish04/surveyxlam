[package]
name = "sma-survey"
version = "0.4.0"
description = "SMA Survey Desktop"
edition = "2021"

[lib]
name = "sma_survey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sma-core = { path = "../../core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
